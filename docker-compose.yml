# PROD: 1 endpoint :8000 (FastAPI serve static UI + API) + Postgres/Timescale.
# Usage: docker compose up --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: tradingbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d tradingbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host 15432 → container 5432 (avoids clashing with a Postgres already running on the host at 5432).
      # The app reaches the DB over the internal docker network (db:5432), so it is NOT affected; this host port
      # is only for accessing the DB from the host machine (psql -h localhost -p 15432).
      - "15432:5432"

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Inside compose the DB host is "db" (overrides DATABASE_URL from .env if needed).
      DATABASE_URL: postgresql+asyncpg://botuser:botpass@db:5432/tradingbot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
