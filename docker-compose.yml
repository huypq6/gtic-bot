# PROD: 1 endpoint :8000 (FastAPI serve static UI + API) + Postgres/Timescale.
# Dùng: docker compose up --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: tradingbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d tradingbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host 5433 → container 5432 (tránh đụng Postgres chạy sẵn ở host trên 5432).
      # App nối DB qua mạng nội bộ docker (db:5432) nên KHÔNG bị ảnh hưởng; cổng host này
      # chỉ để truy cập DB từ máy host (psql -h localhost -p 5433).
      - "5433:5432"

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Trong compose, host DB là "db" (override DATABASE_URL của .env nếu cần).
      DATABASE_URL: postgresql+asyncpg://botuser:botpass@db:5432/tradingbot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
